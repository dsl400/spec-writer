# Publishes the spec-writer skill as a GitHub release asset when a v* tag is pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s skills/spec-writer/tools/ste -p 'test_*.py'
      - name: Write the version of the tag into the skill
        run: sed -i "0,/^  version: .*/s//  version: ${GITHUB_REF_NAME#v}/" skills/spec-writer/SKILL.md && grep -q "^  version: ${GITHUB_REF_NAME#v}$" skills/spec-writer/SKILL.md
      - name: Pack the skill
        run: tar -czf spec-writer.tar.gz -C skills --exclude='test_*' --exclude=__pycache__ spec-writer
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" spec-writer.tar.gz skills/spec-writer/SKILL.md --title "$GITHUB_REF_NAME" --generate-notes
